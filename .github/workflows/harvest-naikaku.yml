name: harvest-naikaku
on:
  workflow_dispatch:
    inputs:
      total:
        description: shard 数
        default: "5"
      limit:
        description: 每 shard 处理条数(0=全)
        default: "3"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: pip install -q requests pillow img2pdf
      - name: harvest
        env:
          WORKLIST: worklist_缺.csv
          OUT: out
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ github.event.inputs.total || '5' }}
          LIMIT: ${{ github.event.inputs.limit || '3' }}
        run: python harvest_naikaku.py
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naikaku-shard-${{ matrix.shard }}
          path: out/
          retention-days: 7
          if-no-files-found: warn
