name: diag-panid
on:
  workflow_dispatch:
    inputs:
      fid:
        default: "36780084"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - env:
          PAN_CID: ${{ secrets.PAN_CID_NEW }}
          PAN_SEC: ${{ secrets.PAN_SEC_NEW }}
          FID: ${{ github.event.inputs.fid }}
        run: python diag_panid.py
