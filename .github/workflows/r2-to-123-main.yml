name: r2-to-123-main
on:
  workflow_dispatch:
    inputs:
      prefix:
        description: R2 前缀(naj/ 或 book/)
        default: "naj/"
      limit:
        description: 单次上传 keys 数
        default: "20"
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: pip install -q boto3 requests
      - name: run
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_KEY: ${{ secrets.R2_KEY }}
          R2_SECRET: ${{ secrets.R2_SECRET }}
          PAN_CID: ${{ secrets.PAN_CID_MAIN }}
          PAN_SEC: ${{ secrets.PAN_SEC_MAIN }}
          BUCKET: guji-sea
          PAN_PARENT: "0"
        run: python r2_to_123_runner.py --prefix ${{ github.event.inputs.prefix }} --limit ${{ github.event.inputs.limit }}
