name: benchmark-pdf2webp
on:
  workflow_dispatch:
    inputs:
      file_id:
        default: "37384870"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pymupdf pillow
      - env:
          PAN_CID: ${{ secrets.PAN_CID_NEW }}
          PAN_SEC: ${{ secrets.PAN_SEC_NEW }}
          FILE_ID: ${{ github.event.inputs.file_id }}
        run: python benchmark_pdf2webp.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-result
          path: |
            benchmark_summary.json
            out_webp/page_0001.webp
          retention-days: 3
          if-no-files-found: warn
