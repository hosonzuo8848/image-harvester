name: iid-check
on:
  workflow_dispatch:
    inputs:
      total:
        default: "5"
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: pip install -q requests
      - name: check
        env:
          WORKLIST: worklist_缺.csv
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ github.event.inputs.total || '5' }}
        run: python iid_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: iid-check-${{ matrix.shard }}
          path: out/
